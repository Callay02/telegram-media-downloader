name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 语法检查 + 单元测试 + 打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 语法检查
        run: |
          for f in src/*.js tools/*.js; do
            node --check "$f"
          done

      - name: 单元测试（模板 / 下载路径 / 下载决策树 / 选中快照）
        run: npm test

      - name: 校验 manifest.json
        run: node -e "const m=require('./manifest.json'); if(m.manifest_version!==3) throw new Error('必须是 MV3'); console.log('manifest ok:', m.name, m.version)"

      - name: 打包扩展（解压即用）
        run: npm run zip

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-media-downloader
          path: telegram-media-downloader.zip
          if-no-files-found: error

  release:
    name: 打 tag 时发布 zip
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm run zip

      - name: 创建 Release 并附上 zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" telegram-media-downloader.zip --title "$GITHUB_REF_NAME" --generate-notes
